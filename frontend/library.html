<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="library.page_title">NETS Builder · Library</title>
  <link rel="stylesheet" href="/css/app.css?v=__VERSION__" />
  <link rel="stylesheet" href="/css/library.css?v=__VERSION__" />
  <script src="/js/theme.js?v=__VERSION__"></script>
  <script src="/js/katex-render.js?v=__VERSION__"></script>
</head>
<body data-page="library">
  <div class="app-shell">
    <header class="topbar glass-card">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true">N</div>
        <div>
          <p class="eyebrow" data-i18n="common.brand_eyebrow">NETS Homework Builder</p>
          <h1 data-i18n="library.h1">Browse Library</h1>
        </div>
      </div>

      <nav class="topbar-nav" aria-label="Site navigation">
        <a class="btn btn-ghost" href="/index.html" data-i18n="common.dashboard">Dashboard</a>
        <a class="btn btn-ghost is-active" href="/library.html" aria-current="page" data-i18n="common.library">Library</a>
      </nav>

      <div class="topbar-actions">
        <div class="lang-switch" role="group" data-i18n-aria-label="common.lang_aria" aria-label="Language">
          <button type="button" class="lang-pill" data-lang="uz">UZ</button>
          <button type="button" class="lang-pill" data-lang="ru">RU</button>
          <button type="button" class="lang-pill" data-lang="en">EN</button>
        </div>
        <button class="btn btn-ghost theme-toggle" data-theme-toggle type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙</button>
      </div>
    </header>

    <main class="dashboard-layout">
      <!-- Top filter bar — language chips + search. Subject and grade
           chips live INSIDE each section, not at the page level, since
           those are the section's own dimensions. -->
      <section class="toolbar glass-card lib-toolbar" data-i18n-aria-label="library.filters_aria" aria-label="Library filters">
        <div class="lib-filter-row lib-lang-row" role="group" data-i18n-aria-label="library.content_lang_aria" aria-label="Content language">
          <span class="lib-filter-label" data-i18n="library.content_lang_label">Til</span>
          <div class="lib-chip-group" id="lib-lang-chips">
            <button type="button" class="lib-chip is-active" data-lib-lang="" data-i18n="library.lang_all">Hammasi</button>
            <button type="button" class="lib-chip" data-lib-lang="uz">UZ</button>
            <button type="button" class="lib-chip" data-lib-lang="ru">RU</button>
            <button type="button" class="lib-chip" data-lib-lang="en">EN</button>
          </div>
        </div>

        <label class="search-box lib-search">
          <span aria-hidden="true">⌕</span>
          <input id="lib-search" type="search" data-i18n-placeholder="library.search_placeholder" placeholder="Search by title or chapter…" autocomplete="off" />
        </label>

        <button class="btn btn-ghost" id="lib-clear-btn" type="button" data-i18n="library.clear">Clear</button>
      </section>

      <!-- Results — grouped by subject. Sections are rendered into
           #lib-sections by library.js. Each section is a collapsible
           <details> with a grade chip strip and a card grid inside. -->
      <section class="library-section" aria-labelledby="lib-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow" data-i18n="library.results_eyebrow">Results</p>
            <h2 id="lib-heading"><span data-i18n="library.h2">Homeworks</span> <span class="tab-count" id="lib-count"></span></h2>
          </div>
        </div>

        <!-- Loading -->
        <div class="loading-state glass-card" id="lib-loading">
          <div class="spinner" aria-hidden="true"></div>
          <p data-i18n="library.loading">Loading library…</p>
        </div>

        <!-- Error -->
        <div class="error-state glass-card hidden" id="lib-error">
          <div class="empty-orb" aria-hidden="true">⚠</div>
          <h3 data-i18n="common.could_not_reach_server">Could not reach the server</h3>
          <p id="lib-error-msg" data-i18n="common.check_connection">Check your connection and try again.</p>
          <button class="btn btn-primary" id="lib-retry-btn" type="button" data-i18n="common.retry">Retry</button>
        </div>

        <!-- Empty state — shown when zero homeworks across all sections. -->
        <div class="empty-state glass-card hidden" id="lib-empty">
          <div class="empty-orb" aria-hidden="true">📚</div>
          <h3 data-i18n="library.empty_h3">No homeworks found</h3>
          <p data-i18n="library.empty_text">Try adjusting your filters or search query.</p>
        </div>

        <!-- Subject sections live here — populated by library.js. -->
        <div id="lib-sections" class="lib-sections" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="/js/i18n/strings.js?v=__VERSION__"></script>
  <script src="/js/i18n.js?v=__VERSION__"></script>
  <script src="/js/api.js?v=__VERSION__"></script>
  <script src="/js/library.js?v=__VERSION__"></script>
</body>
</html>
